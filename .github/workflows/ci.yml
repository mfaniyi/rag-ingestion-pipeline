name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

# Grant the workflow read-only access to repository contents.
permissions:
  contents: read

jobs:
  test:
    name: Run automated tests
    runs-on: ubuntu-latest

    # Start PostgreSQL with pgvector for the test environment.
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: raguser
          POSTGRES_PASSWORD: ragpassword
          POSTGRES_DB: ragdb
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U raguser -d ragdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Check out the repository.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Install uv and the project's pinned Python version.
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      # Install dependencies exactly as recorded in uv.lock.
      - name: Install dependencies
        run: uv sync --locked --dev

      # Enable the pgvector extension required by the application.
      - name: Enable pgvector
        run: |
          PGPASSWORD=ragpassword psql \
            -h localhost \
            -p 5433 \
            -U raguser \
            -d ragdb \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"

      # Execute the automated test suite.
      - name: Run tests
        run: uv run pytest -q